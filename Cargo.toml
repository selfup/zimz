[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"
license = "GPL-3.0-or-later"
authors = ["Regis Boudinot"]
repository = "https://github.com/selfup/zimz"

[workspace.dependencies]
zimz-core = { path = "crates/zimz-core" }
zimz-glass = { path = "crates/zimz-glass" }
zimz-extract = { path = "crates/zimz-extract" }
zimz-search = { path = "crates/zimz-search" }
zimz-mcp = { path = "crates/zimz-mcp" }
anyhow = "1"
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
liblzma = { version = "0.4", features = ["static"] }
lru = "0.18"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
md-5 = "0.11"
memmap2 = "0.9"
percent-encoding = "2.3"
ruzstd = "0.9"
scraper = { version = "0.27", default-features = false }
rust-stemmers = "1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-general-category = "1.1"
unicode-normalization = "0.1"
zstd = "0.14"
rayon = "1.10"
glob-match = "0.2"
tempfile = "3"
rmcp = { version = "3.4", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "signal"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
axum = "0.8"
tower = "0.5"
http-body-util = "0.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
cast_possible_truncation = "allow"
cast_lossless = "allow"
similar_names = "allow"

[profile.release]
lto = "thin"
codegen-units = 1

# Dependencies (decoders, the HTML parser, hashing) dominate test time and are not
# what we debug; keep them optimised under the dev/test profiles.
[profile.dev.package."*"]
opt-level = 3
