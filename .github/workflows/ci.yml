name: CI
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Cache fixtures
        uses: actions/cache@v5
        with:
          path: fixtures/zim-testing-suite
          key: zim-testing-suite-${{ hashFiles('scripts/fetch-fixtures.sh') }}
      - run: ./scripts/fetch-fixtures.sh
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Test pure-Rust codecs
        run: ./scripts/actions/pure_rust_codecs.sh
      - name: Validate the test builder's archives with python-libzim
        run: ./scripts/actions/validate_builder.sh
      - name: Search and suggestion parity against python-libzim (fixture)
        run: ./scripts/actions/search_and_suggest.sh
        run: ./scripts/actions/parity.sh
